[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["practice/exercises.py"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "numpy", "numpy.*"]
follow_imports = "skip"
